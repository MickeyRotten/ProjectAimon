<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aimon — Data Editor (dev tool)</title>
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Aimon Data Editor</h1>
      <span class="hint">dev tool — served by <code>npm run dev</code> only; writes directly to repo files</span>
      <span id="fs-status" class="fs-status"></span>
      <button id="pick-dir" type="button">Choose repo folder…</button>
    </header>

    <nav id="tabs" class="tabs"></nav>
    <nav id="subtabs" class="subtabs"></nav>

    <div class="workspace">
      <main id="editor" class="editor">
        <div class="placeholder">Loading…</div>
      </main>
      <aside id="issues" class="issues"></aside>
    </div>

    <footer class="bar status">
      <span id="status"></span>
      <span class="spacer"></span>
      <button id="revert" type="button" disabled>Revert file</button>
      <button id="reload" type="button" disabled>Reload from disk</button>
      <button id="save" type="button" disabled>Review &amp; Save (Ctrl+S)</button>
    </footer>

    <!-- The closed tag vocabulary, refreshed from tags.json; drives autocomplete. -->
    <datalist id="tag-vocab"></datalist>

    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
